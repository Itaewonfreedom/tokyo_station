<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', sans-serif; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,30,55,.92), rgba(5,8,18,.97));
    color: #fff; text-align: center; cursor: pointer; transition: opacity .5s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .emoji { font-size: 4rem; margin-bottom: .6rem; animation: choo 2.4s ease-in-out infinite; }
  @keyframes choo { 0%,100% { transform: translateX(-18px); } 50% { transform: translateX(18px); } }
  #overlay h1 { font-size: 2rem; margin-bottom: .3rem; letter-spacing: .05em; }
  #overlay h2 { font-size: .95rem; font-weight: 400; color: #9fb4d8; margin-bottom: 1.6rem; }
  #overlay .desc { font-size: .85rem; color: #8294b8; line-height: 1.7; margin-bottom: 2rem; }
  #overlay .start {
    font-size: 1.25rem; padding: .9rem 3rem; border-radius: 999px; color: #fff;
    background: linear-gradient(135deg, #79c143, #4e9a2e);
    border: 2px solid #a5e07a; box-shadow: 0 0 35px rgba(121,193,67,.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 60px rgba(121,193,67,.9); transform: scale(1.04); } }

  .btn-col {
    position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 10;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ui-btn {
    position: relative; width: 58px; height: 58px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(15,22,40,.72); backdrop-filter: blur(8px);
    color: #fff; font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); transition: transform .12s, background .2s;
    user-select: none;
  }
  .ui-btn:active { transform: scale(.9); }
  .ui-btn.active { background: rgba(121,193,67,.55); border-color: #a5e07a; }
  .ui-btn small { position: absolute; bottom: 3px; font-size: 8px; color: rgba(255,255,255,.75); }

  #quality {
    position: fixed; bottom: 14px; right: 12px; z-index: 10;
    display: flex; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.25); background: rgba(15,22,40,.72); backdrop-filter: blur(8px);
  }
  #quality button {
    border: none; background: transparent; color: #aab8d5; font-size: .8rem;
    padding: .6rem 1rem; cursor: pointer; transition: background .2s;
  }
  #quality button.active { background: rgba(121,193,67,.55); color: #fff; font-weight: 700; }

  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 10; pointer-events: none; user-select: none;
    color: rgba(255,255,255,.92); text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  #hud .title { font-size: 1rem; font-weight: 700; letter-spacing: .05em; }
  #hud .sub { font-size: .75rem; color: rgba(190,205,235,.9); margin-top: 3px; }

  #toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 10;
    background: rgba(15,22,40,.85); color: #fff; padding: .5rem 1.2rem; border-radius: 999px;
    font-size: .85rem; opacity: 0; transition: opacity .3s; pointer-events: none;
    border: 1px solid rgba(255,255,255,.2); white-space: nowrap;
  }
  #toast.show { opacity: 1; }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   Renderer / Scene / Camera
================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 1600);
camera.position.set(-80, 45, 150);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, -10);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 4;
controls.maxDistance = 520;

/* ================================================================
   Track network — the throat
   The yard is FAT at the station (10 tracks) and gets SLIM far away:
   ladders merge it to 5 through lines, then the lines themselves sweep
   together into an 18m corridor squeezed between buildings.
================================================================ */
const Z_END = 760;
const PLATFORM_LEN = 210;
const LADDER_CLEAR = 105;
const GAUGE = 0.72;

/* Real Tokyo Station layout, west → east (from the track map):
   Chuo rapid (terminal, buffers south) | Keihin-Tohoku + Yamanote ×4 |
   Ueno-Tokyo Line (Tokaido main) ×2 | Tokaido Shinkansen (terminal,
   buffers north) | Tohoku Shinkansen (terminal, buffers south).
   North and south throats carry different line bundles. */
const LINES_X = {
  CH1: -23.0, CH2: -18.6,                 // 中央線快速 (terminal, enters from N)
  KA: -14.2, YA: -9.8, YB: -5.4, KB: -1.0, // 京浜東北 / 山手 loops (through)
  UTN: 3.4, UTS: 7.8,                     // 上野東京ライン/東海道本線 (through)
  TKS1: 14.0, TKS2: 18.4, TKP: 22.8,      // 東海道新幹線 (terminal, enters from S)
  THS1: 27.2, THS2: 31.6,                 // 東北新幹線 (terminal, enters from N)
};

// throat squeeze: beyond |z|=205 the lines sweep into slim corridors.
// N/S targets differ because each side carries a different bundle.
const SQ_Z0 = 205, SQ_Z1 = 345;
const SQUEEZE = {
  CH1: { N: -15.8, S: null }, CH2: { N: -11.4, S: null },
  KA:  { N: -7.0,  S: -11.4 }, YA: { N: -2.6, S: -7.0 },
  YB:  { N: 1.8,   S: -2.6 },  KB: { N: 6.2,  S: 1.8 },
  UTN: { N: 10.6,  S: 6.2 },   UTS: { N: 15.0, S: 10.6 },
  TKS1:{ N: null,  S: 15.0 },  TKS2:{ N: null, S: 19.4 },
  THS1:{ N: 19.4,  S: null },  THS2:{ N: 23.8, S: null },
};
// line types: T = through, N = north-only (buffer at z=+118),
// S = south-only (buffer at z=-118)
const LINE_DEFS = {
  CH1: 'N', CH2: 'N',
  KA: 'T', YA: 'T', YB: 'T', KB: 'T', UTN: 'T', UTS: 'T',
  TKS1: 'S', TKS2: 'S', THS1: 'N', THS2: 'N',
};
const BUFFER_Z = 118;

const PLATFORMS = [
  { x: -20.8 }, { x: -12 }, { x: -3.2 }, { x: 5.6 },
  { x: 16.2 }, { x: 20.6 }, { x: 29.4 },
];

const smooth = k => k * k * (3 - 2 * k);
const lerp = (a, b, k) => a + (b - a) * k;

// x of a line at signed z (terminal lines stay at their yard x on the
// side where they end at buffers)
function lineXAt(line, z) {
  const x0 = LINES_X[line];
  const sq = SQUEEZE[line];
  if (!sq) return x0;
  const to = z < 0 ? sq.N : sq.S;
  if (to == null) return x0;
  const az = Math.abs(z);
  if (az <= SQ_Z0) return x0;
  if (az >= SQ_Z1) return to;
  return lerp(x0, to, smooth((az - SQ_Z0) / (SQ_Z1 - SQ_Z0)));
}

// outer edges of the rail corridor (drives ballast, gantries, city).
// South of the station the Chuo & Tohoku-Shinkansen tracks are gone,
// so the south throat is narrower than the north one.
function corridorEdges(z) {
  if (z < 0)
    return { left: lineXAt('CH1', z) - 3.2, right: lineXAt('THS2', z) + 3.2 };
  const k = smooth(Math.min(1, Math.max(0, (z - 120) / 70)));
  return {
    left: lerp(-26.2, lineXAt('KA', z) - 3.2, k),
    right: lerp(34.8, lineXAt('TKS2', z) + 3.2, k),
  };
}

function buildRoute(line, dir) {
  const step = 2;
  const pts = [];
  for (let z = -Z_END; z <= Z_END + 0.01; z += step)
    pts.push([lineXAt(line, z), z]);
  if (dir < 0) pts.reverse();
  const ss = [0];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i-1][0], dz = pts[i][1] - pts[i-1][1];
    ss.push(ss[i-1] + Math.hypot(dx, dz));
  }
  const S = ss[ss.length - 1];
  function posAt(s, out) {
    s = Math.max(0.001, Math.min(S - 0.001, s));
    let lo = 0, hi = ss.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (ss[m] < s) lo = m + 1; else hi = m; }
    const i = Math.max(1, lo);
    const t = (s - ss[i-1]) / (ss[i] - ss[i-1]);
    out.x = pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * t;
    out.z = pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * t;
    out.yaw = Math.atan2(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    return out;
  }
  function sAtZ(zq) {
    let best = 0, bd = 1e9;
    for (let i = 0; i < pts.length; i++) {
      const d = Math.abs(pts[i][1] - zq);
      if (d < bd) { bd = d; best = i; }
    }
    return ss[best];
  }
  return { posAt, sAtZ, S,
    sStop: sAtZ(0),
    sEnterClear: sAtZ(dir > 0 ? -LADDER_CLEAR : LADDER_CLEAR) };
}

/* ================================================================
   Procedural textures
================================================================ */
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

const ballastTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4e4a45'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const v = 50 + Math.random() * 70;
    g.fillStyle = `rgb(${v|0},${v*0.95|0},${v*0.88|0})`;

/* nose skin: u wraps the cross-section ring (0 = belly, 0.5 = top),
   v runs base→tip. Painted per row so the colour band can widen
   toward the tip like the real duckbill */
function noseTex({ top, stripe, bottom, bandBase, bandTip, topFill = true }) {
  return canvasTex(256, 256, (g, w, h) => {
    for (let row = 0; row < h; row++) {
      const v = 1 - row / h;                       // texture v of this row
      const band = bandBase + (bandTip - bandBase) * v;
      g.fillStyle = bottom; g.fillRect(0, row, w, 1);
      if (topFill) {
        g.fillStyle = top;
        g.fillRect((0.5 - band) * w, row, band * 2 * w, 1);
      }
      g.fillStyle = stripe;
      g.fillRect((0.5 - band - 0.024) * w, row, 0.024 * w, 1);
      g.fillRect((0.5 + band) * w, row, 0.024 * w, 1);
    }
  });
}

/* ================================================================
   Occlusion fading — buildings/roofs turn translucent when the camera
   is inside them or when they block the view of a followed train
================================================================ */
const fadeables = [];
function registerFadeable(root) {
  const mats = [];
  root.traverse(o => {
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) if (!mats.includes(m)) mats.push(m);
    }
  });
  const box = new THREE.Box3().setFromObject(root);
  fadeables.push({ mats, box, value: 1, target: 1, applied: false });
}

const _fadeRay = new THREE.Ray();
const _trainPos = new THREE.Vector3();
function updateFades(dt) {
  for (const f of fadeables) f.target = 1;
  for (const f of fadeables)
    if (f.box.containsPoint(camera.position)) f.target = 0.12;
  if (followTrain && followTrain.group.visible) {
    followTrain.route.posAt(followTrain.sHead - 8, _p);
    _trainPos.set(_p.x, 3, _p.z);
    const dist = camera.position.distanceTo(_trainPos);
    _fadeRay.origin.copy(camera.position);
    _fadeRay.direction.copy(_trainPos).sub(camera.position).normalize();
    for (const f of fadeables) {
      if (f.target < 1) continue;
      if (_fadeRay.intersectsBox(f.box) &&
          f.box.distanceToPoint(camera.position) < dist) f.target = 0.18;
    }
  }
  for (const f of fadeables) {
    if (Math.abs(f.target - f.value) < 0.002 && f.applied && f.target === 1 && f.value > 0.998) continue;
    f.value += (f.target - f.value) * Math.min(1, dt * 6);
    if (f.target === 1 && f.value > 0.998) f.value = 1;
    const transparent = f.value < 0.985;
    for (const m of f.mats) {
      m.transparent = transparent;
      m.opacity = transparent ? f.value : 1;
      m.depthWrite = f.value > 0.55;
    }
    f.applied = true;
  }
}

const tieMat = new THREE.MeshStandardMaterial({ color: 0x46413b, roughness: 1 });
const tieGeo = new THREE.BoxGeometry(2.1, 0.12, 0.5);
const tieMatrices = [];
const _m4 = new THREE.Matrix4();
const _eu = new THREE.Euler();

function straightRails(x, z0, z1) {
  const len = z1 - z0, zc = (z0 + z1) / 2;
  const geo = new THREE.BoxGeometry(0.14, 0.18, len);
  for (const dx of [-GAUGE, GAUGE]) {
    const r = new THREE.Mesh(geo, railMat);
    r.position.set(x + dx, 0.45, zc);
    scene.add(r);
  }
  for (let z = z0 + 0.9; z < z1; z += 1.8) {
    _m4.makeTranslation(x, 0.36, z);
    tieMatrices.push(_m4.clone());
  }
}

function curveRails(x0, x1, z0, z1, sideSign) {
  const n = Math.max(22, Math.ceil((z1 - z0) / 3));
  for (const off of [-GAUGE, GAUGE]) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const az = z0 + (z1 - z0) * (i / n);
      const x = x0 + (x1 - x0) * smooth((az - z0) / (z1 - z0));
      pts.push(new THREE.Vector3(x + off, 0.45, sideSign * az));
    }
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n * 2, 0.085, 5, false),
      railMat
    );
    scene.add(tube);
  }
  for (let az = z0 + 0.9; az < z1; az += 1.8) {
    const k = (az - z0) / (z1 - z0);
    const x = x0 + (x1 - x0) * smooth(k);
    const x2 = x0 + (x1 - x0) * smooth(Math.min(1, k + 0.04));
    _eu.set(0, Math.atan2(x2 - x, sideSign * (z1 - z0) * 0.04), 0);
    _m4.makeRotationFromEuler(_eu);
    _m4.setPosition(x, 0.36, sideSign * az);
    tieMatrices.push(_m4.clone());
  }

const cityMats = [];

const cityFar = new THREE.Group();
{
  const rng = (() => { let s = 1234567; return () => (s = s * 16807 % 2147483647) / 2147483647; })();
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x8e9296, roughness: 0.9 });

  function makeBuilding(x, z, w, d, h, taper) {
    const g = new THREE.Group();
    const style = (rng() * 3) | 0;
    const mat = new THREE.MeshStandardMaterial({
      map: facadeDay[style].clone(),
      emissiveMap: facadeNight[style],
      emissive: 0xffffff, emissiveIntensity: 0,
      roughness: style === 0 ? 0.35 : 0.7,
      metalness: style === 0 ? 0.4 : 0.1,
    });
    mat.map.repeat.set(Math.max(1, (w + d) / 26 | 0), Math.max(2, h / 15 | 0));
    cityMats.push(mat);

    if (taper && h > 60) {
      const ph = 10 + rng() * 8;
      const podium = new THREE.Mesh(new THREE.BoxGeometry(w, ph, d), mat);
      podium.position.y = ph / 2;
      podium.castShadow = podium.receiveShadow = true;
      g.add(podium);
      const tw = w * 0.72, td = d * 0.72;
      const tower = new THREE.Mesh(new THREE.BoxGeometry(tw, h - ph, td), mat);
      tower.position.y = ph + (h - ph) / 2;
      tower.castShadow = tower.receiveShadow = true;
      g.add(tower);
      const pent = new THREE.Mesh(new THREE.BoxGeometry(tw * 0.4, 4, td * 0.4), roofMat);
      pent.position.y = h + 2;
      g.add(pent);
    } else {
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      body.position.y = h / 2;
      body.castShadow = body.receiveShadow = true;
      g.add(body);
      if (rng() < 0.6) {
        const pent = new THREE.Mesh(new THREE.BoxGeometry(w * 0.35, 3, d * 0.35), roofMat);
        pent.position.y = h + 1.5;
        g.add(pent);
      }
    }
    g.position.set(x, 0, z);
    return g;
  }

  for (const side of [-1, 1]) {
    let z = -720;
    while (z < 720) {
      const d = 26 + rng() * 22;
      const gap = 7 + rng() * 12;
      const zC = z + d / 2;
      const edges = corridorEdges(zC);
      let inner = side < 0 ? edges.left - 9 : edges.right + 9;
      // keep the Marunouchi plaza clear in front of the brick station
      if (side < 0 && Math.abs(zC) < 125) inner = Math.min(inner, -62);

      const rows = Math.abs(zC) < 460 ? 2 : 1;
      let xEdge = inner;
      for (let row = 0; row < rows; row++) {
        const w = 20 + rng() * 18;
        const street = row === 0 ? 0 : 8 + rng() * 8;
        const x = side < 0 ? xEdge - street - w / 2 : xEdge + street + w / 2;
        let h = 35 + rng() * 75;
        if (Math.abs(zC) < 280) h *= 1.3;
        if (rng() < 0.15) h *= 1.5;
        h = Math.min(175, Math.max(28, h));
        const b = makeBuilding(x, zC, w, d - 4, h, rng() < 0.45);
        (row === 0 ? cityNear : cityFar).add(b);
        xEdge = side < 0 ? x - w / 2 : x + w / 2;
      }
      z += d + gap;
    }
  }
}

/* ---------- lofted duckbill nose (E5 / N700) ----------
   cross-sections morph from the car-body silhouette at the joint to a
   flat ellipse at the tip; built once per nose length and cached */
const noseGeoCache = {};
function getNoseGeo(len) {
  if (noseGeoCache[len]) return noseGeoCache[len];
  const segs = 26, ring = 26;
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const w = CAR_W * (1 - 0.06 * t - 0.62 * Math.pow(t, 2.1));
    const top = lerp(4.32, 1.32, Math.pow(t, 1.5));
    const bot = lerp(0.55, 0.98, Math.pow(t, 2.4));
    const cy = (top + bot) / 2, hh = Math.max(0.06, (top - bot) / 2);
    for (let k = 0; k <= ring; k++) {
      const a = k / ring;
      const phi = a * Math.PI * 2 - Math.PI / 2;     // a=0 belly, a=0.5 roof
      const cx = Math.cos(phi), sy = Math.sin(phi);
      // superellipse squash → flatter sides and roof, like the real shell
      const px = (w / 2) * Math.sign(cx) * Math.pow(Math.abs(cx), 0.72);
      const py = cy + hh * Math.sign(sy) * Math.pow(Math.abs(sy), 0.82);
      pos.push(px, py, t * len);
      uvs.push(a, t);
    }
  }
  for (let i = 0; i < segs; i++)
    for (let k = 0; k < ring; k++) {
      const a = i * (ring + 1) + k, b = a + ring + 1;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
  // tip cap fan
  const tip = pos.length / 3;
  pos.push(0, (1.32 + 0.98) / 2, len + 0.04);
  uvs.push(0.5, 1);
  const last = segs * (ring + 1);
  for (let k = 0; k < ring; k++) idx.push(last + k, last + k + 1, tip);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  noseGeoCache[len] = geo;
  return geo;
}

    shoe.position.set(0, 6.26, z0 - 0.42);
    markDetail(shoe); car.add(shoe);
  }

  for (let i = 0; i < T.cars; i++) {
    const car = new THREE.Group();
    const body = new THREE.Mesh(carGeo, [sideMatA, sideMatB, roofCarMat, darkMat, endMat, endMat]);
    body.position.y = 2.55;
    body.castShadow = true;
    car.add(body);

    // curved roof cap (atlas roof texture on the E235)
    const cap = new THREE.Mesh(roofCapGeo, roofMat);
    cap.rotation.x = Math.PI / 2;
    cap.position.y = ROOF_Y;
    car.add(cap);

    const skirt = new THREE.Mesh(skirtGeo, [underMat, underMat, darkMat, darkMat, darkMat, darkMat]);
    skirt.position.y = 0.72;
    car.add(skirt);

    for (const bz of [-6.4, 6.4]) {
      const core = new THREE.Mesh(bogieCoreGeo, darkMat);
      core.position.set(0, 0.7, bz);
      markDetail(core);
      car.add(core);
      for (const sx of [-1, 1]) {
        const b = new THREE.Mesh(bogiePlaneGeo, bogieMat);
        b.position.set(sx * 1.18, 0.75, bz);
        b.rotation.y = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
        car.add(b);
      }
    }

    if (!isShink) {
      const ac = new THREE.Mesh(acGeo, acMat);
      ac.position.set(0, 4.45, -3.4);
      markDetail(ac);
      car.add(ac);
      if (i > 0) {       // inter-car gangway bellows
        const gw = new THREE.Mesh(gangwayGeo, darkMat);
        gw.position.set(0, 2.5, -CAR_LEN / 2 - 0.05);
        markDetail(gw);
        car.add(gw);
      }
      if (i === 2 || i === 5) addPantograph(car, 3.2);
    } else {
      // full-width diaphragm between Shinkansen cars
      if (i > 0) {
        const gw = new THREE.Mesh(gangwayGeo, endMat);
        gw.scale.set(1.6, 1.05, 1);
        gw.position.set(0, 2.45, -CAR_LEN / 2 - 0.05);
        markDetail(gw);
        car.add(gw);
      }
      if (i === 3) {     // low-profile Shinkansen pantograph + side shields
        addPantograph(car, 0);
        for (const sx of [-1.35, 1.35]) {
          const shield = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 3.6), endMat);
          shield.position.set(sx, 4.7, 0);
          markDetail(shield);
          car.add(shield);
        }
      }
    }
    group.add(car);
    cars.push(car);
  }

  function addEnd(carIdx, sign) {
    const car = cars[carIdx];
    if (isShink) {
      // sculpted duckbill nose lofted from the body silhouette
      const noseMat = new THREE.MeshStandardMaterial({
        map: T.noseTex, roughness: 0.28, metalness: 0.12, side: THREE.DoubleSide });
      const nose = new THREE.Mesh(getNoseGeo(T.noseLen), noseMat);
      nose.position.set(0, 0, sign * (CAR_LEN / 2 - 0.25));
      if (sign < 0) nose.rotation.y = Math.PI;
      nose.castShadow = true;
      car.add(nose);
      // cockpit canopy
      const ws = new THREE.Mesh(
        new THREE.SphereGeometry(0.62, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), noseGlassMat);
      ws.scale.set(1.05, 0.62, 1.9);
      ws.position.set(0, 3.7, sign * (CAR_LEN / 2 + T.noseLen * 0.3));
      markDetail(ws);
      car.add(ws);
      // under-nose skirt
      const skirtNose = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 2.6), darkMat);
      skirtNose.position.set(0, 0.62, sign * (CAR_LEN / 2 + T.noseLen * 0.3));
      markDetail(skirtNose);
      car.add(skirtNose);
    } else {
      const tex = T.atlas ? (sign > 0 ? yamanoteMats.face : yamanoteMats.faceBack) : T.face;
      const f = new THREE.Mesh(
        new THREE.PlaneGeometry(CAR_W, 3.6),
        new THREE.MeshBasicMaterial({ map: tex })
      );
      f.position.set(0, 2.35, sign * (CAR_LEN / 2 + 0.03));
      if (sign < 0) f.rotation.y = Math.PI;
      car.add(f);
      // close the curved roof above the cab
      const capEnd = new THREE.Mesh(roofEndGeo, endMat);
      capEnd.position.set(0, ROOF_Y, sign * (CAR_LEN / 2 + 0.02));
      if (sign < 0) capEnd.rotation.y = Math.PI;
      markDetail(capEnd);
      car.add(capEnd);
      // front skirt + coupler
      const fs = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.6, 0.5), darkMat);
      fs.position.set(0, 0.75, sign * (CAR_LEN / 2 - 0.1));
      markDetail(fs); car.add(fs);
      const coupler = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.34, 0.7), darkMat);
      coupler.position.set(0, 0.62, sign * (CAR_LEN / 2 + 0.3));
      markDetail(coupler); car.add(coupler);
    }
    const lightGeo = new THREE.SphereGeometry(isShink ? 0.1 : 0.13, 8, 8);
    for (const sx of [-0.3, 0.3]) {
      const m = new THREE.MeshBasicMaterial({ color: 0xfff6d8 });
      const l = new THREE.Mesh(lightGeo, m);
      if (isShink) l.position.set(sx, 1.62, sign * (CAR_LEN / 2 + T.noseLen - 1.7));
      else l.position.set(sx * 3.17, 1.2, sign * (CAR_LEN / 2 + 0.12));
      car.add(l);
      (sign > 0 ? lampsPlus : lampsMinus).push(m);
    }
  }
  addEnd(0, 1);
  addEnd(T.cars - 1, -1);

  const len = T.cars * (CAR_LEN + CAR_GAP) - CAR_GAP;
  return { group, cars, sideMatA, sideMatB, lampsPlus, lampsMinus, len, type: T, typeKey, atlas: !!T.atlas };
}

// headlights face the direction of travel (terminals reverse out)
function setTravel(t, fwd) {
  for (const m of t.lampsPlus) m.color.setHex(fwd ? 0xfff6d8 : 0xff2a1a);
  for (const m of t.lampsMinus) m.color.setHex(fwd ? 0xff2a1a : 0xfff6d8);
}

/* ================================================================
   Dispatcher — block reservations on the shared through lines
================================================================ */
const blocks = {};
function blockFree(id) { return !blocks[id]; }
function occupy(id, t) { blocks[id] = t; }
function release(id, t) { if (blocks[id] === t) delete blocks[id]; }

const trains = [];
// terminal=true: the train enters, dwells, then REVERSES back out the
// way it came (Chuo & both Shinkansen, like the real station)
function addTrain(typeKey, line, dir, phase, terminal = false) {
  const t = buildTrain(typeKey);
  t.dir = dir;
  t.line = line;
  t.terminal = terminal;
  t.route = buildRoute(line, dir);
  const entrySide = dir > 0 ? 'N:' : 'S:';
  const exitSide = dir > 0 ? 'S:' : 'N:';
  t.entryBlock = entrySide + line;
  t.exitBlock = (terminal ? entrySide : exitSide) + line;
  t.platBlock = 'P:' + line;
  t.sStop = t.route.sStop + t.len / 2;
  t.sExitClear = t.route.sAtZ(dir > 0 ? 190 : -190);
  t.state = 'wait';
  t.timer = phase;
  t.speed = 0;
  t.sHead = 0;
  t.group.visible = false;
  t.brakeDist = (t.type.maxSpeed ** 2) / 2.6;
  scene.add(t.group);
  trains.push(t);
  return t;
}

// track, Chuo and the Shinkansen terminate, everything else through-runs

let parkedTrain = null;

function setDoors(t, open) {
  if (t.atlas) {
    t.sideMatA.map = open ? yamanoteMats.side1Open : yamanoteMats.side1;
    t.sideMatB.map = open ? yamanoteMats.side2Open : yamanoteMats.side2;
  } else {
    t.sideMatA.map = open ? t.type.sideOpen : t.type.sideClosed;
  }
}

const _p = { x: 0, z: 0, yaw: 0 };
function placeCars(t) {
  for (let i = 0; i < t.cars.length; i++) {
    const s = t.sHead - CAR_LEN / 2 - i * (CAR_LEN + CAR_GAP);
    t.route.posAt(s, _p);
    t.cars[i].position.set(_p.x, 0, _p.z);
    t.cars[i].rotation.y = _p.yaw;
  }
}

function despawn(t) {
  release(t.exitBlock, t);
  release(t.platBlock, t);
  t.state = 'wait';
  t.timer = 5 + Math.random() * 9;
  t.group.visible = false;
}

function updateTrain(t, dt) {
  switch (t.state) {
    case 'wait':
      t.timer -= dt;
      if (t.timer <= 0 && blockFree(t.entryBlock) && blockFree(t.platBlock)) {
        occupy(t.entryBlock, t);
        occupy(t.platBlock, t);
        t.state = 'enter';
        t.sHead = t.len + 2;
        t.speed = t.type.maxSpeed;
        t.group.visible = true;
        setTravel(t, true);
        placeCars(t);
      }
      break;
    case 'enter': {
      const dist = t.sStop - t.sHead;
      if (dist <= 0.08) {
        t.sHead = t.sStop; t.speed = 0;
        t.state = 'dwell'; t.timer = t.type.dwell;
        setDoors(t, true);
        sound.arrive();
      } else {
        if (dist < t.brakeDist)
          t.speed = Math.max(1.2, t.type.maxSpeed * Math.sqrt(dist / t.brakeDist));
        t.sHead += t.speed * dt;
      }
      if (blocks[t.entryBlock] === t && t.sHead - t.len > t.route.sEnterClear)
        release(t.entryBlock, t);
      placeCars(t);
      break;
    }
    case 'dwell':
      t.timer -= dt;
      if (t.timer <= 0 && blockFree(t.exitBlock)) {
        occupy(t.exitBlock, t);
        t.state = 'closing'; t.timer = 1.6;
        sound.doors();
      }
      break;
    case 'closing':
      t.timer -= dt;
      if (t.timer <= 0.9) setDoors(t, false);
      if (t.timer <= 0) {
        if (t.terminal) {
          t.state = 'departRev';
          setTravel(t, false);     // now running cab-first the other way
        } else {
          t.state = 'depart';
        }
        sound.jingle();
      }
      break;
    case 'depart':
      t.speed = Math.min(t.type.maxSpeed, t.speed + 2.2 * dt);
      t.sHead += t.speed * dt;
      if (blocks[t.platBlock] === t && t.sHead - t.len > t.sExitClear)
        release(t.platBlock, t);
      if (t.sHead >= t.route.S - 1) despawn(t);
      else placeCars(t);
      break;
    case 'departRev':   // terminal turnback: run back out the entry side
      t.speed = Math.min(t.type.maxSpeed, t.speed + 2.2 * dt);
      t.sHead -= t.speed * dt;
      if (t.sHead <= t.len + 2) despawn(t);
      else placeCars(t);
      break;
  }
}

function updateSignals() {
  for (const sig of signals) {
    const occupied = !blockFree(sig.side + ':' + sig.line) || !blockFree('P:' + sig.line);
    sig.redMat.emissiveIntensity = occupied ? 1.6 : 0.05;
    sig.greenMat.emissiveIntensity = occupied ? 0.05 : 1.4;
  }
}

/* ================================================================
   Sound
================================================================ */
const sound = (() => {
  let ctx = null, on = false;
  const ensure = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  function tone(freq, delay, dur, type = 'triangle', vol = 0.12) {
    if (!on) return;
    ensure();
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.setValueAtTime(0, t0);
    gn.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(gn).connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    toggle() { on = !on; if (on) ensure(); return on; },
    jingle() { [659, 784, 880, 784, 988, 880].forEach((f, i) => tone(f, i * 0.16, 0.15)); },
    arrive() { tone(740, 0, 0.25); tone(587, 0.28, 0.35); },
    doors() { tone(830, 0, 0.1, 'square', 0.07); tone(830, 0.18, 0.1, 'square', 0.07); },
    horn(high) {
      tone(high ? 520 : 310, 0, 0.55, 'sawtooth', 0.09);
      tone(high ? 620 : 370, 0, 0.55, 'sawtooth', 0.09);
    },
  };
})();

let isNight = false, nightBlend = 0;
const dayTop = new THREE.Color(0x3d7ad6), dayBot = new THREE.Color(0xcfe4f7);
const nightTop = new THREE.Color(0x050a18), nightBot = new THREE.Color(0x141d36);
const dayFog = new THREE.Color(0xcfe4f7), nightFog = new THREE.Color(0x0a0f1d);

function updateDayNight(dt) {
  const target = isNight ? 1 : 0;
  nightBlend += (target - nightBlend) * Math.min(1, dt * 1.6);
  const b = nightBlend;
  skyUniforms.topColor.value.copy(dayTop).lerp(nightTop, b);
  skyUniforms.bottomColor.value.copy(dayBot).lerp(nightBot, b);
  scene.fog.color.copy(dayFog).lerp(nightFog, b);
  sun.intensity = 2.0 * (1 - b) + 0.08 * b;
  hemiLight.intensity = 0.9 * (1 - b) + 0.22 * b;
  starMat.opacity = b * 0.9;
  moon.material.opacity = b;
  renderer.toneMappingExposure = 1.0 - b * 0.2;
  roofLightMat.emissiveIntensity = b * 1.8;
  station.userData.glowMat.emissiveIntensity = b * 1.5;
  for (const m of cityMats) m.emissiveIntensity = b * 1.0;
}

================================================================ */
const qualities = {
  low:  { px: 0.7, shadows: false, shadowSize: 512,  fogFar: 450, detail: false },
  med:  { px: 1.0, shadows: true,  shadowSize: 1024, fogFar: 650, detail: true },
  high: { px: Math.min(devicePixelRatio, 2), shadows: true, shadowSize: 2048, fogFar: 800, detail: true },
};
function setTrainDetail(visible) {
  trainDetailVisible = visible;
  const all = parkedTrain ? [...trains, parkedTrain] : trains;
  for (const t of all)
    t.group.traverse(o => { if (o.userData.detail) o.visible = visible; });
}
function applyQuality(q) {
  const Q = qualities[q];
  renderer.setPixelRatio(Q.px);
  renderer.setSize(window.innerWidth, window.innerHeight);
  sun.castShadow = Q.shadows;
  renderer.shadowMap.enabled = Q.shadows;
  sun.shadow.mapSize.set(Q.shadowSize, Q.shadowSize);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  scene.traverse(o => {
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(mm => mm.needsUpdate = true);
    }
  });
  scene.fog.far = Q.fogFar;
  detailGroup.visible = Q.detail;
  cityFar.visible = Q.detail;
  setTrainDetail(Q.detail);
  document.querySelectorAll('#quality button').forEach(b => b.classList.toggle('active', b.dataset.q === q));
  toast({ low: '저사양 모드 (그림자·디테일 끔)', med: '보통 화질', high: '고화질 모드' }[q]);
}

let camAnim = null;
let followTrain = null;

function flyTo(pos, target, dur = 1.4) {
  followTrain = null;
  controls.enabled = true;
  camAnim = {
    p0: camera.position.clone(), t0: controls.target.clone(),
    p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...target),
    k: 0, dur,
  };
  setActiveBtn();
}
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

const views = {
  sat:  { pos: [6, 330, 40], target: [6, 0, 0], label: '위성 뷰 🛰️' },
  plat: { pos: [-12, 3.2, 75], target: [-13, 2.6, -40], label: '승강장 뷰 🚉' },
  wide: { pos: [-105, 55, 165], target: [0, 6, -10], label: '전경 뷰 🏙️' },
};

let followIdx = 0;
function followNext() {
  const candidates = trains.filter(t => t.group.visible);
  if (!candidates.length) { toast('지금은 들어오는 기차가 없어요. 잠시만요!'); return; }
  followIdx = (followIdx + 1) % candidates.length;
  followTrain = candidates[followIdx];
  camAnim = null;
  controls.enabled = false;
  toast(`${followTrain.type.name} 따라가는 중 🚆`);
  setActiveBtn();
}

const _fp = { x: 0, z: 0, yaw: 0 };
function updateFollow(dt) {
  if (!followTrain) return;
  if (!followTrain.group.visible) {
    const next = trains.find(t => t.group.visible);
    if (next) { followTrain = next; toast(`${next.type.name} 따라가는 중 🚆`); }
    else { followTrain = null; controls.enabled = true; setActiveBtn(); return; }
  }
  const t = followTrain;
  t.route.posAt(t.sHead - 4, _fp);
  const rev = t.state === 'departRev' ? -1 : 1;   // terminals back out
  const fx = Math.sin(_fp.yaw) * rev, fz = Math.cos(_fp.yaw) * rev;
  const desired = new THREE.Vector3(
    _fp.x - fx * 16 + fz * 13, 6.5, _fp.z - fz * 16 - fx * 13);
  const look = new THREE.Vector3(_fp.x + fx * 8, 3, _fp.z + fz * 8);
  const a = 1 - Math.exp(-3.2 * dt);
  camera.position.lerp(desired, a);
  controls.target.lerp(look, a);
}

/* ---------- tap a train → horn ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null, dragged = false;

renderer.domElement.addEventListener('pointerdown', e => {
  downPos = [e.clientX, e.clientY];
  dragged = false;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (downPos && Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 8) {
    dragged = true;
    if (followTrain) { followTrain = null; controls.enabled = true; setActiveBtn(); }
  }
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos || dragged) { downPos = null; return; }
  downPos = null;
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const all = parkedTrain ? [...trains, parkedTrain] : trains;
  for (const t of all) {
    if (!t.group.visible) continue;
    if (raycaster.intersectObject(t.group, true).length) {
      sound.horn(!!t.type.shink);
      toast(`${t.type.name} 빵빵! 🚆💨`);
      return;
    }
  }
});

  yamanoteMats.roof = makeRoofTex(atlas.image);
  yamanoteMats.side1Open = makeOpenSideTex(atlas.image, R.side1);
  yamanoteMats.side2Open = makeOpenSideTex(atlas.image, R.side2);

  for (const t of trains) {
    scene.remove(t.group);
    const fresh = buildTrain(t.typeKey);
    t.group = fresh.group; t.cars = fresh.cars;
    t.sideMatA = fresh.sideMatA; t.sideMatB = fresh.sideMatB;
    t.lampsPlus = fresh.lampsPlus; t.lampsMinus = fresh.lampsMinus;
    t.atlas = fresh.atlas;
    t.group.visible = t.state !== 'wait';
    scene.add(t.group);
    if (t.group.visible) {
      setTravel(t, t.state !== 'departRev');
      placeCars(t);
    }
  }
  startTrains();
  setTrainDetail(qualities[currentQuality].detail);
});

applyQuality(currentQuality);

const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const t of trains) updateTrain(t, dt);
  updateSignals();
  updateDayNight(dt);
  updateFades(dt);
  if (camAnim) {
    camAnim.k += dt / camAnim.dur;
    const e = ease(Math.min(camAnim.k, 1));
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.k >= 1) camAnim = null;
  }
  updateFollow(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
