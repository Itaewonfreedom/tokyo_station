<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
    font-family: 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', sans-serif; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; touch-action: none; }

  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,30,55,.92), rgba(5,8,18,.97));
    color: #fff; text-align: center; cursor: pointer; transition: opacity .5s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay .emoji { font-size: 4rem; margin-bottom: .6rem; animation: choo 2.4s ease-in-out infinite; }
  @keyframes choo { 0%,100% { transform: translateX(-18px); } 50% { transform: translateX(18px); } }
  #overlay h1 { font-size: 2rem; margin-bottom: .3rem; letter-spacing: .05em; }
  #overlay h2 { font-size: .95rem; font-weight: 400; color: #9fb4d8; margin-bottom: 1.6rem; }
  #overlay .desc { font-size: .85rem; color: #8294b8; line-height: 1.7; margin-bottom: 2rem; }
  #overlay .start {
    font-size: 1.25rem; padding: .9rem 3rem; border-radius: 999px; color: #fff;
    background: linear-gradient(135deg, #79c143, #4e9a2e);
    border: 2px solid #a5e07a; box-shadow: 0 0 35px rgba(121,193,67,.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { box-shadow: 0 0 60px rgba(121,193,67,.9); transform: scale(1.04); } }

  .btn-col {
    position: fixed; right: 12px; top: 50%; transform: translateY(-50%); z-index: 10;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ui-btn {
    position: relative; width: 58px; height: 58px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(15,22,40,.72); backdrop-filter: blur(8px);
    color: #fff; font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); transition: transform .12s, background .2s;
    user-select: none;
  }
  .ui-btn:active { transform: scale(.9); }
  .ui-btn.active { background: rgba(121,193,67,.55); border-color: #a5e07a; }
  .ui-btn small { position: absolute; bottom: 3px; font-size: 8px; color: rgba(255,255,255,.75); }

  #quality {
    position: fixed; bottom: 14px; right: 12px; z-index: 10;
    display: flex; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.25); background: rgba(15,22,40,.72); backdrop-filter: blur(8px);
  }
  #quality button {
    border: none; background: transparent; color: #aab8d5; font-size: .8rem;
    padding: .6rem 1rem; cursor: pointer; transition: background .2s;
  }
  #quality button.active { background: rgba(121,193,67,.55); color: #fff; font-weight: 700; }

  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 10; pointer-events: none; user-select: none;
    color: rgba(255,255,255,.92); text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
  #hud .title { font-size: 1rem; font-weight: 700; letter-spacing: .05em; }
  #hud .sub { font-size: .75rem; color: rgba(190,205,235,.9); margin-top: 3px; }

  #toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); z-index: 10;
    background: rgba(15,22,40,.85); color: #fff; padding: .5rem 1.2rem; border-radius: 999px;
    font-size: .85rem; opacity: 0; transition: opacity .3s; pointer-events: none;
    border: 1px solid rgba(255,255,255,.2); white-space: nowrap;
  }
  #toast.show { opacity: 1; }

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   Renderer / Scene / Camera
================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 1600);
camera.position.set(-80, 45, 150);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, -10);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 4;
controls.maxDistance = 520;

/* ================================================================
   Track network — the throat
   The yard is FAT at the station (10 tracks) and gets SLIM far away:
   ladders merge it to 5 through lines, then the lines themselves sweep
   together into an 18m corridor squeezed between buildings.
================================================================ */
const Z_END = 760;
const PLATFORM_LEN = 210;
const LADDER_CLEAR = 105;
const GAUGE = 0.72;

/* Real Tokyo Station layout, west → east. In the station zone the
   tracks SPREAD APART around each island platform (±3.4m from the
   platform centreline) so the yard bulges into the lens shape seen in
   the satellite photo, then sweeps back into slim corridors. A gentle
   global S-bend curves the whole alignment so nothing is ruler-straight. */
const LINES_X = {
  CH1: -32.3, CH2: -23.6,                  // 中央線快速 (terminal, enters from N)
  KA: -19.4, YA: -10.7, YB: -6.5, KB: 2.2, // 京浜東北 / 山手 loops (through)
  UTN: 6.4, UTS: 15.1,                     // 上野東京ライン (through)
  TKS1: 19.7, TKS2: 28.4, TKP: 37.1,       // 東海道新幹線 (terminal, enters from S)
  THS1: 41.5, THS2: 50.2,                  // 東北新幹線 (terminal, enters from N)
};

// throat squeeze: beyond |z|=160 the lines sweep into slim corridors
const SQ_Z0 = 160, SQ_Z1 = 380;
const SQUEEZE = {
  CH1: { N: -15.8, S: null }, CH2: { N: -11.4, S: null },
  KA:  { N: -7.0,  S: -11.4 }, YA: { N: -2.6, S: -7.0 },
  YB:  { N: 1.8,   S: -2.6 },  KB: { N: 6.2,  S: 1.8 },
  UTN: { N: 10.6,  S: 6.2 },   UTS: { N: 15.0, S: 10.6 },
  TKS1:{ N: null,  S: 15.0 },  TKS2:{ N: null, S: 19.4 },
  THS1:{ N: 19.4,  S: null },  THS2:{ N: 23.8, S: null },
};
const LINE_DEFS = {
  CH1: 'N', CH2: 'N',
  KA: 'T', YA: 'T', YB: 'T', KB: 'T', UTN: 'T', UTS: 'T',
  TKS1: 'S', TKS2: 'S', THS1: 'N', THS2: 'N',
};
const BUFFER_Z = 155;

// island platforms like the satellite: different lengths, staggered
// offsets (the roof ends fan diagonally), all curved with the bend
const PLATFORMS = [
  { x: -27.95, len: 230, off: -14 },   // Chuo
  { x: -15.05, len: 264, off: 0 },     // Keihin/Yamanote
  { x: -2.15,  len: 286, off: 6 },     // Yamanote/Keihin
  { x: 10.75,  len: 286, off: 12 },    // Ueno-Tokyo
  { x: 24.05,  len: 292, off: 4 },     // Tokaido Shinkansen
  { x: 32.75,  len: 292, off: -6 },    // Tokaido Shinkansen
  { x: 45.85,  len: 262, off: -18 },   // Tohoku Shinkansen
];

const smooth = k => k * k * (3 - 2 * k);
const lerp = (a, b, k) => a + (b - a) * k;

// global S-bend across the whole site (like the satellite alignment)
const BEND_AMP = 26;
const bendAt = z => BEND_AMP * (smooth((z + Z_END) / (2 * Z_END)) * 2 - 1);

// x of a line at signed z (squeeze + global bend)
function lineXAt(line, z) {
  let x = LINES_X[line];
  const sq = SQUEEZE[line];
  if (sq) {
    const to = z < 0 ? sq.N : sq.S;
    if (to != null) {
      const az = Math.abs(z);
      if (az >= SQ_Z1) x = to;
      else if (az > SQ_Z0) x = lerp(x, to, smooth((az - SQ_Z0) / (SQ_Z1 - SQ_Z0)));
    }
  }
  return x + bendAt(z);
}

// outer edges of the rail corridor (drives ballast, gantries, city)
function corridorEdges(z) {
  if (z < 0)
    return { left: lineXAt('CH1', z) - 3.2, right: lineXAt('THS2', z) + 3.2 };
  // south of the station the Chuo & Tohoku-Shinkansen tracks are gone
  const k = smooth(Math.min(1, Math.max(0, (z - 150) / 60)));
  return {
    left: lerp(lineXAt('CH1', z) - 3.2, lineXAt('KA', z) - 3.2, k),
    right: lerp(lineXAt('THS2', z) + 3.2, lineXAt('TKS2', z) + 3.2, k),
  };
}

function buildRoute(line, dir) {
  const step = 2;
  const pts = [];
  for (let z = -Z_END; z <= Z_END + 0.01; z += step)
    pts.push([lineXAt(line, z), z]);
  if (dir < 0) pts.reverse();
  const ss = [0];
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i-1][0], dz = pts[i][1] - pts[i-1][1];
    ss.push(ss[i-1] + Math.hypot(dx, dz));
  }
  const S = ss[ss.length - 1];
  function posAt(s, out) {
    s = Math.max(0.001, Math.min(S - 0.001, s));
    let lo = 0, hi = ss.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (ss[m] < s) lo = m + 1; else hi = m; }
    const i = Math.max(1, lo);
    const t = (s - ss[i-1]) / (ss[i] - ss[i-1]);
    out.x = pts[i-1][0] + (pts[i][0] - pts[i-1][0]) * t;
    out.z = pts[i-1][1] + (pts[i][1] - pts[i-1][1]) * t;
    out.yaw = Math.atan2(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    return out;
  }
  function sAtZ(zq) {
    let best = 0, bd = 1e9;
    for (let i = 0; i < pts.length; i++) {
      const d = Math.abs(pts[i][1] - zq);
      if (d < bd) { bd = d; best = i; }
    }
    return ss[best];
  }
  return { posAt, sAtZ, S,
    sStop: sAtZ(0),
    sEnterClear: sAtZ(dir > 0 ? -LADDER_CLEAR : LADDER_CLEAR) };
}

function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* nose skin: u wraps the cross-section ring (0 = belly, 0.5 = top),
   v runs base→tip. Painted per row so the colour band can widen
   toward the tip like the real duckbill */
function noseTex({ top, stripe, bottom, bandBase, bandTip, topFill = true }) {
  return canvasTex(256, 256, (g, w, h) => {
    for (let row = 0; row < h; row++) {
      const v = 1 - row / h;                       // texture v of this row
      const band = bandBase + (bandTip - bandBase) * v;
      g.fillStyle = bottom; g.fillRect(0, row, w, 1);
      if (topFill) {
        g.fillStyle = top;
        g.fillRect((0.5 - band) * w, row, band * 2 * w, 1);
      }
      g.fillStyle = stripe;
      g.fillRect((0.5 - band - 0.024) * w, row, 0.024 * w, 1);
      g.fillRect((0.5 + band) * w, row, 0.024 * w, 1);
    }
  });
}

/* E5 nose skin following the provided UV sheet: metallic turquoise

function e5NoseDetail() {
  return canvasTex(512, 512, (g, w, h) => {
    const bandBase = 0.21, bandTip = 0.32;
    for (let row = 0; row < h; row++) {
      const v = 1 - row / h;
      const band = bandBase + (bandTip - bandBase) * v;
      g.fillStyle = '#ffffff'; g.fillRect(0, row, w, 1);
      g.fillStyle = '#d9dcdf';                       // under-nose skirt grey
      g.fillRect(0, row, 0.075 * w, 1);
      g.fillRect(w - 0.075 * w, row, 0.075 * w, 1);
      g.fillStyle = E5_TEAL;
      g.fillRect((0.5 - band) * w, row, band * 2 * w, 1);
      g.fillStyle = E5_PINK;
      g.fillRect((0.5 - band - 0.022) * w, row, 0.022 * w, 1);
      g.fillRect((0.5 + band) * w, row, 0.022 * w, 1);
    }
    // metallic sheen along the crown
    const sheen = g.createLinearGradient(0.28 * w, 0, 0.72 * w, 0);
    sheen.addColorStop(0, 'rgba(0,34,36,.20)');
    sheen.addColorStop(0.5, 'rgba(255,255,255,.16)');
    sheen.addColorStop(1, 'rgba(0,34,36,.20)');
    g.fillStyle = sheen; g.fillRect(0.27 * w, 0, 0.46 * w, h);
    // panel seams: teal crown centreline + base ring + white lower panels
    g.strokeStyle = 'rgba(6,44,46,.4)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0.5 * w, 0); g.lineTo(0.5 * w, (1 - 0.46) * h); g.stroke();
    g.beginPath(); g.moveTo(0.3 * w, (1 - 0.035) * h); g.lineTo(0.7 * w, (1 - 0.035) * h); g.stroke();
    g.strokeStyle = 'rgba(125,134,142,.45)';
    for (const u of [0.135, 0.865]) {
      g.beginPath(); g.moveTo(u * w, 0); g.lineTo(u * w, h); g.stroke();
    }
    g.beginPath(); g.moveTo(0.075 * w, (1 - 0.5) * h); g.lineTo(0.27 * w, (1 - 0.5) * h); g.stroke();
    g.beginPath(); g.moveTo(0.73 * w, (1 - 0.5) * h); g.lineTo(0.925 * w, (1 - 0.5) * h); g.stroke();
    // windshield (#111418 glass per the sheet) — tapered toward the tip
    const yTip = (1 - 0.45) * h, yBase = (1 - 0.17) * h;
    g.fillStyle = '#0a0e12';
    g.beginPath();
    g.moveTo(0.445 * w, yTip);
    g.lineTo(0.555 * w, yTip);
    g.quadraticCurveTo(0.60 * w, yTip + (yBase - yTip) * 0.5, 0.578 * w, yBase);
    g.quadraticCurveTo(0.5 * w, yBase + 14, 0.422 * w, yBase);
    g.quadraticCurveTo(0.40 * w, yTip + (yBase - yTip) * 0.5, 0.445 * w, yTip);
    g.fill();
    g.strokeStyle = '#111418'; g.lineWidth = 7; g.stroke();
    // glass reflection streak
    g.fillStyle = 'rgba(150,205,215,.16)';
    g.fillRect(0.45 * w, yTip + 14, 0.10 * w, 16);
    // 4-lamp headlight cluster at the tip edge of the window
    g.fillStyle = '#fff9e8';
    for (let i = 0; i < 4; i++) {
      g.beginPath();
      g.arc((0.4665 + i * 0.0225) * w, yTip + 9, 5, 0, 7);
      g.fill();
    }
  });
}

function atlasRegionTex(atlas, r, flipX = false) {
  const t = atlas.clone();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (flipX) {
    t.repeat.set(-r.w / ATLAS_W, r.h / ATLAS_H);
    t.offset.set((r.x + r.w) / ATLAS_W, (ATLAS_H - r.y - r.h) / ATLAS_H);
  } else {
    t.repeat.set(r.w / ATLAS_W, r.h / ATLAS_H);
    t.offset.set(r.x / ATLAS_W, (ATLAS_H - r.y - r.h) / ATLAS_H);
  }
  return t;
}

/* ================================================================
   Occlusion fading — buildings/roofs turn translucent when the camera
   is inside them or when they block the view of a followed train
================================================================ */
const fadeables = [];
function registerFadeable(root) {
  const mats = [];
  root.traverse(o => {
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) if (!mats.includes(m)) mats.push(m);
    }
  });
  const box = new THREE.Box3().setFromObject(root);
  fadeables.push({ mats, box, value: 1, target: 1, applied: false });
}

const _fadeRay = new THREE.Ray();
const _trainPos = new THREE.Vector3();
function updateFades(dt) {
  for (const f of fadeables) f.target = 1;
  for (const f of fadeables)
    if (f.box.containsPoint(camera.position)) f.target = 0.12;
  if (followTrain && followTrain.group.visible) {
    followTrain.route.posAt(followTrain.sHead - 8, _p);
    _trainPos.set(_p.x, 3, _p.z);
    const dist = camera.position.distanceTo(_trainPos);
    _fadeRay.origin.copy(camera.position);
    _fadeRay.direction.copy(_trainPos).sub(camera.position).normalize();
    for (const f of fadeables) {
      if (f.target < 1) continue;
      if (_fadeRay.intersectsBox(f.box) &&
          f.box.distanceToPoint(camera.position) < dist) f.target = 0.18;
    }
  }
  for (const f of fadeables) {
    if (Math.abs(f.target - f.value) < 0.002 && f.applied && f.target === 1 && f.value > 0.998) continue;
    f.value += (f.target - f.value) * Math.min(1, dt * 6);
    if (f.target === 1 && f.value > 0.998) f.value = 1;
    const transparent = f.value < 0.985;
    for (const m of f.mats) {
      m.transparent = transparent;
      m.opacity = transparent ? f.value : 1;
      m.depthWrite = f.value > 0.55;
    }
    f.applied = true;
  }
}

// every rail is laid by sampling an x(z) path — nothing is forced
// straight, so the global bend and the yard bulge flow through all of it
function railPath(xFn, z0, z1) {
  const n = Math.max(8, Math.ceil((z1 - z0) / 3));
  for (const off of [-GAUGE, GAUGE]) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const z = z0 + (z1 - z0) * (i / n);
      pts.push(new THREE.Vector3(xFn(z) + off, 0.45, z));
    }
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n, 0.085, 5, false),
      railMat
    );
    scene.add(tube);
  }
  for (let z = z0 + 0.9; z < z1; z += 1.8) {
    const x = xFn(z);
    _eu.set(0, Math.atan2(xFn(z + 0.6) - x, 0.6), 0);
    _m4.makeRotationFromEuler(_eu);
    _m4.setPosition(x, 0.36, z);
    tieMatrices.push(_m4.clone());
  }
}

// sweeps a cross-section profile along a curved centreline x(z);
// scaleFn(z) tapers the profile width so platform ends come to points
function sweepProfile(cxFn, z0, z1, profile, mat, vScale = 0.25, scaleFn = null) {
  const rows = Math.max(4, Math.ceil((z1 - z0) / 5));
  const np = profile.length;
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= rows; i++) {
    const z = z0 + (z1 - z0) * (i / rows);
    const cx = cxFn(z);
    const s = scaleFn ? scaleFn(z) : 1;
    for (let p = 0; p < np; p++) {
      pos.push(cx + profile[p][0] * s, profile[p][1], z);
      uv.push(p / (np - 1), z * vScale);
    }
    if (i > 0) {
      const a = (i - 1) * np, b = i * np;
      for (let p = 0; p < np - 1; p++)
        idx.push(a + p, b + p, a + p + 1, a + p + 1, b + p, b + p + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
{

  const R = 12, HALF = Math.asin(4.2 / R);
  const archProfile = [];
  for (let i = 0; i <= 16; i++) {
    const a = -HALF + (2 * HALF) * (i / 16);
    archProfile.push([R * Math.sin(a), 5.6 - R + R * Math.cos(a)]);
  }
  const deckProfile = [[-2.6, 0], [-2.6, 1.1], [2.6, 1.1], [2.6, 0]];

    const cx = z => x + bendAt(z);    // platforms follow the curved alignment

    const archMat = new THREE.MeshStandardMaterial({

      const ph = 10 + rng() * 8;
      const podium = new THREE.Mesh(new THREE.BoxGeometry(w, ph, d), mat);
      podium.position.y = ph / 2;
      podium.castShadow = podium.receiveShadow = true;
      g.add(podium);
      const tw = w * 0.72, td = d * 0.72;
      const tower = new THREE.Mesh(new THREE.BoxGeometry(tw, h - ph, td), mat);
      tower.position.y = ph + (h - ph) / 2;
      tower.castShadow = tower.receiveShadow = true;
      g.add(tower);
      const pent = new THREE.Mesh(new THREE.BoxGeometry(tw * 0.4, 4, td * 0.4), roofMat);
      pent.position.y = h + 2;
      g.add(pent);
    } else {
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      body.position.y = h / 2;
      body.castShadow = body.receiveShadow = true;
      g.add(body);
      if (rng() < 0.6) {
        const pent = new THREE.Mesh(new THREE.BoxGeometry(w * 0.35, 3, d * 0.35), roofMat);
        pent.position.y = h + 1.5;
        g.add(pent);
      }
    }
    g.position.set(x, 0, z);
    return g;
  }

  for (const side of [-1, 1]) {
    let z = -720;
    while (z < 720) {
      const d = 26 + rng() * 22;
      const gap = 7 + rng() * 12;
      const zC = z + d / 2;
      const edges = corridorEdges(zC);
      let inner = side < 0 ? edges.left - 9 : edges.right + 9;
      // keep the Marunouchi park & plaza clear in front of the brick station
      if (side < 0 && Math.abs(zC) < 130) inner = Math.min(inner, -98);
      // reserve the Yaesu front for the GranTokyo complex
      if (side > 0 && Math.abs(zC) < 210) inner = Math.max(inner, 92);

      const rows = Math.abs(zC) < 460 ? 2 : 1;
      let xEdge = inner;
      for (let row = 0; row < rows; row++) {
        const w = 20 + rng() * 18;
        const street = row === 0 ? 0 : 8 + rng() * 8;
        const x = side < 0 ? xEdge - street - w / 2 : xEdge + street + w / 2;
        let h = 35 + rng() * 75;
        if (Math.abs(zC) < 280) h *= 1.3;
        if (rng() < 0.15) h *= 1.5;
        h = Math.min(175, Math.max(28, h));
        const b = makeBuilding(x, zC, w, d - 4, h, rng() < 0.45);
        (row === 0 ? cityNear : cityFar).add(b);
        xEdge = side < 0 ? x - w / 2 : x + w / 2;
      }
      z += d + gap;
    }
  }
}

const CAR_LEN = 19.5, CAR_W = 2.95, CAR_H = 3.2, CAR_GAP = 0.5;

const skirtGeo = new THREE.BoxGeometry(2.6, 0.5, CAR_LEN - 1);

const bogieCoreGeo = new THREE.BoxGeometry(2.2, 0.9, 2.3);
const gangwayGeo = new THREE.BoxGeometry(1.5, 2.3, 0.55);

// curved roof cap: arc chord = car width, peak ~0.35m above the body top
const ROOF_R = 3.4, ROOF_HALF = 0.45;
const roofCapGeo = new THREE.CylinderGeometry(
  ROOF_R, ROOF_R, CAR_LEN, 14, 1, true, Math.PI - ROOF_HALF, ROOF_HALF * 2);
const ROOF_Y = 4.15 - ROOF_R * Math.cos(ROOF_HALF);   // arc peak ≈ 4.49
// cab-end face shaped to the body+roof-cap silhouette, so the front
// texture hugs the car tube instead of floating as a bigger rectangle
const cabFaceGeo = (() => {
  const s = new THREE.Shape();
  s.moveTo(-CAR_W / 2, 0.55);
  s.lineTo(-CAR_W / 2, 4.15);
  for (let i = 0; i <= 10; i++) {
    const a = -ROOF_HALF + (2 * ROOF_HALF) * (i / 10);
    s.lineTo(ROOF_R * Math.sin(a), 4.15 - ROOF_R * Math.cos(ROOF_HALF) + ROOF_R * Math.cos(a));
  }
  s.lineTo(CAR_W / 2, 4.15);
  s.lineTo(CAR_W / 2, 0.55);
  s.closePath();
  const g = new THREE.ShapeGeometry(s, 4);
  const peak = 4.15 - ROOF_R * Math.cos(ROOF_HALF) + ROOF_R;
  const uvA = g.attributes.uv, pA = g.attributes.position;
  for (let i = 0; i < uvA.count; i++)
    uvA.setXY(i, (pA.getX(i) + CAR_W / 2) / CAR_W, (pA.getY(i) - 0.55) / (peak - 0.55));
  return g;
})();

/* ---------- lofted duckbill nose (E5 / N700) ----------
   cross-sections morph from the car-body silhouette at the joint to a
   flat ellipse at the tip; built once per nose length and cached */
const noseGeoCache = {};
function getNoseGeo(len) {
  if (noseGeoCache[len]) return noseGeoCache[len];
  const segs = 26, ring = 26;
  const pos = [], uvs = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const w = CAR_W * (1 - 0.06 * t - 0.62 * Math.pow(t, 2.1));
    const top = lerp(4.32, 1.32, Math.pow(t, 1.5));
    const bot = lerp(0.55, 0.98, Math.pow(t, 2.4));
    const cy = (top + bot) / 2, hh = Math.max(0.06, (top - bot) / 2);
    for (let k = 0; k <= ring; k++) {
      const a = k / ring;
      const phi = a * Math.PI * 2 - Math.PI / 2;     // a=0 belly, a=0.5 roof
      const cx = Math.cos(phi), sy = Math.sin(phi);
      // superellipse squash → flatter sides and roof, like the real shell
      const px = (w / 2) * Math.sign(cx) * Math.pow(Math.abs(cx), 0.72);
      const py = cy + hh * Math.sign(sy) * Math.pow(Math.abs(sy), 0.82);
      pos.push(px, py, t * len);
      uvs.push(a, t);
    }
  }
  for (let i = 0; i < segs; i++)
    for (let k = 0; k < ring; k++) {
      const a = i * (ring + 1) + k, b = a + ring + 1;
      idx.push(a, a + 1, b, b, a + 1, b + 1);
    }
  // tip cap fan
  const tip = pos.length / 3;
  pos.push(0, (1.32 + 0.98) / 2, len + 0.04);
  uvs.push(0.5, 1);
  const last = segs * (ring + 1);
  for (let k = 0; k < ring; k++) idx.push(last + k, last + k + 1, tip);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  noseGeoCache[len] = geo;
  return geo;
}

let trainDetailVisible = true;
function markDetail(mesh) { mesh.userData.detail = true; mesh.visible = trainDetailVisible; return mesh; }

function buildTrain(typeKey) {
  const T = trainTypes[typeKey];
  const isShink = !!T.shink;
  const group = new THREE.Group();
  const cars = [];
  const lampsPlus = [], lampsMinus = [];   // marker lights at each train end

  let sideMatA, sideMatB, roofMat, acMat;
  if (T.atlas) {
    sideMatA = new THREE.MeshStandardMaterial({ map: yamanoteMats.side1, roughness: 0.4, metalness: 0.15 });
    sideMatB = new THREE.MeshStandardMaterial({ map: yamanoteMats.side2, roughness: 0.4, metalness: 0.15 });
    roofMat = new THREE.MeshStandardMaterial({ map: yamanoteMats.roof, roughness: 0.55 });
    acMat = new THREE.MeshStandardMaterial({ map: yamanoteMats.ac, roughness: 0.6 });
  } else if (T.e5Atlas && e5Mats.side1) {
    // E5 Hayabusa photo atlas
    sideMatA = new THREE.MeshStandardMaterial({ map: e5Mats.side1, roughness: 0.35, metalness: 0.15 });
    sideMatB = new THREE.MeshStandardMaterial({ map: e5Mats.side2, roughness: 0.35, metalness: 0.15 });
    roofMat = new THREE.MeshStandardMaterial({ map: e5Mats.roof, roughness: 0.45 });
    acMat = roofCarMat;
  } else {
    sideMatA = sideMatB = new THREE.MeshStandardMaterial({ map: T.sideClosed, roughness: 0.45, metalness: 0.25 });
    if (T.roofTex) roofMat = new THREE.MeshStandardMaterial({ map: T.roofTex, roughness: 0.5 });
    else if (T.roofColor) roofMat = new THREE.MeshStandardMaterial({ color: T.roofColor, roughness: 0.55 });
    else roofMat = roofCarMat;
    acMat = roofCarMat;
  }
  const useE5Gear = !!(T.e5Atlas && e5Mats.under);
  const underMat = new THREE.MeshStandardMaterial({
    map: useE5Gear ? e5Mats.under : yamanoteMats.under, roughness: 0.9 });
  const bogieMat = new THREE.MeshStandardMaterial({
    map: useE5Gear ? e5Mats.bogie : yamanoteMats.bogie, roughness: 0.85 });

  function addPantograph(car, z0) {
    const pBase = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.07, 0.9), darkMat);
    pBase.position.set(0, 4.6, z0);
    markDetail(pBase); car.add(pBase);
    for (const sx of [-0.45, 0.45]) {
      const ins = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.18, 6), darkMat);
      ins.position.set(sx, 4.5, z0);
      markDetail(ins); car.add(ins);
    }
    const lower = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.0, 0.07), darkMat);
    lower.position.set(0, 5.05, z0 + 0.32); lower.rotation.x = 0.62;
    markDetail(lower); car.add(lower);
    const upper = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.0, 0.06), darkMat);
    upper.position.set(0, 5.85, z0 - 0.1); upper.rotation.x = -0.7;
    markDetail(upper); car.add(upper);
    const shoe = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.05, 0.24), darkMat);
    shoe.position.set(0, 6.26, z0 - 0.42);
    markDetail(shoe); car.add(shoe);
  }

  for (let i = 0; i < T.cars; i++) {
    const car = new THREE.Group();
    const body = new THREE.Mesh(carGeo, [sideMatA, sideMatB, roofCarMat, darkMat, endMat, endMat]);
    body.position.y = 2.55;
    body.castShadow = true;
    car.add(body);

    // curved roof cap (atlas roof texture on the E235)
    const cap = new THREE.Mesh(roofCapGeo, roofMat);
    cap.rotation.x = Math.PI / 2;
    cap.position.y = ROOF_Y;
    car.add(cap);

    const skirt = new THREE.Mesh(skirtGeo, [underMat, underMat, darkMat, darkMat, darkMat, darkMat]);
    skirt.position.y = 0.72;
    car.add(skirt);

    for (const bz of [-6.4, 6.4]) {
      const core = new THREE.Mesh(bogieCoreGeo, darkMat);
      core.position.set(0, 0.7, bz);
      markDetail(core);
      car.add(core);
      for (const sx of [-1, 1]) {
        const b = new THREE.Mesh(bogiePlaneGeo, bogieMat);
        b.position.set(sx * 1.18, 0.75, bz);
        b.rotation.y = sx > 0 ? Math.PI / 2 : -Math.PI / 2;
        car.add(b);
      }
    }

    if (!isShink) {
      const ac = new THREE.Mesh(acGeo, acMat);
      ac.position.set(0, 4.45, -3.4);
      markDetail(ac);
      car.add(ac);
      if (i < T.cars - 1) {  // gangway bellows — between cars only,
        const gw = new THREE.Mesh(gangwayGeo, darkMat);  // never on the cab end
        gw.position.set(0, 2.5, -CAR_LEN / 2 - 0.05);
        markDetail(gw);
        car.add(gw);
      }
      if (i === 2 || i === 5) addPantograph(car, 3.2);
    } else {
      // full-width diaphragm between Shinkansen cars (not on cab ends)
      if (i < T.cars - 1) {
        const gw = new THREE.Mesh(gangwayGeo, endMat);
        gw.scale.set(1.6, 1.05, 1);
        gw.position.set(0, 2.45, -CAR_LEN / 2 - 0.05);
        markDetail(gw);
        car.add(gw);
      }
      if (i === 3) {     // low-profile Shinkansen pantograph + side shields
        addPantograph(car, 0);
        for (const sx of [-1.35, 1.35]) {
          const shield = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 3.6), endMat);
          shield.position.set(sx, 4.7, 0);
          markDetail(shield);
          car.add(shield);
        }
      }
    }
    group.add(car);
    cars.push(car);
  }

  function addEnd(carIdx, sign) {
    const car = cars[carIdx];
    if (isShink) {
      // sculpted duckbill nose lofted from the body silhouette
      const noseMat = new THREE.MeshStandardMaterial({
        map: T.noseTex, roughness: 0.22, metalness: 0.28, side: THREE.DoubleSide });
      const nose = new THREE.Mesh(getNoseGeo(T.noseLen), noseMat);
      nose.position.set(0, 0, sign * (CAR_LEN / 2 - 0.25));
      if (sign < 0) nose.rotation.y = Math.PI;
      nose.castShadow = true;
      car.add(nose);
      // cockpit canopy
      const ws = new THREE.Mesh(
        new THREE.SphereGeometry(0.62, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), noseGlassMat);
      ws.scale.set(1.05, 0.62, 1.9);
      ws.position.set(0, 3.7, sign * (CAR_LEN / 2 + T.noseLen * 0.3));
      markDetail(ws);
      car.add(ws);
      // under-nose skirt
      const skirtNose = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.5, 2.6), darkMat);
      skirtNose.position.set(0, 0.62, sign * (CAR_LEN / 2 + T.noseLen * 0.3));
      markDetail(skirtNose);
      car.add(skirtNose);
    } else {
      const tex = T.atlas ? (sign > 0 ? yamanoteMats.face : yamanoteMats.faceBack) : T.face;
      const f = new THREE.Mesh(cabFaceGeo, new THREE.MeshBasicMaterial({ map: tex }));
      f.position.set(0, 0, sign * (CAR_LEN / 2 + 0.03));
      if (sign < 0) f.rotation.y = Math.PI;
      car.add(f);
      // front skirt + coupler
      const fs = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.6, 0.5), darkMat);
      fs.position.set(0, 0.75, sign * (CAR_LEN / 2 - 0.1));
      markDetail(fs); car.add(fs);
      const coupler = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.34, 0.7), darkMat);
      coupler.position.set(0, 0.62, sign * (CAR_LEN / 2 + 0.3));
      markDetail(coupler); car.add(coupler);
    }
    const lightGeo = new THREE.SphereGeometry(isShink ? 0.1 : 0.13, 8, 8);
    for (const sx of [-0.3, 0.3]) {
      const m = new THREE.MeshBasicMaterial({ color: 0xfff6d8 });
      const l = new THREE.Mesh(lightGeo, m);
      if (T.e5Atlas) l.position.set(sx * 0.9, 3.42, sign * (CAR_LEN / 2 + T.noseLen * 0.44));
      else if (isShink) l.position.set(sx, 1.62, sign * (CAR_LEN / 2 + T.noseLen - 1.7));
      else l.position.set(sx * 3.17, 1.2, sign * (CAR_LEN / 2 + 0.12));
      car.add(l);
      (sign > 0 ? lampsPlus : lampsMinus).push(m);
    }
  }
  addEnd(0, 1);
  addEnd(T.cars - 1, -1);

  const len = T.cars * (CAR_LEN + CAR_GAP) - CAR_GAP;
  return { group, cars, sideMatA, sideMatB, lampsPlus, lampsMinus, len, type: T, typeKey, atlas: !!T.atlas };
}

// headlights face the direction of travel (terminals reverse out)
function setTravel(t, fwd) {
  for (const m of t.lampsPlus) m.color.setHex(fwd ? 0xfff6d8 : 0xff2a1a);
  for (const m of t.lampsMinus) m.color.setHex(fwd ? 0xff2a1a : 0xfff6d8);
}

/* ================================================================
   Dispatcher — block reservations on the shared through lines
================================================================ */
const blocks = {};
function blockFree(id) { return !blocks[id]; }
function occupy(id, t) { blocks[id] = t; }
function release(id, t) { if (blocks[id] === t) delete blocks[id]; }

const trains = [];
// terminal=true: the train enters, dwells, then REVERSES back out the
// way it came (Chuo & both Shinkansen, like the real station)
function addTrain(typeKey, line, dir, phase, terminal = false) {
  const t = buildTrain(typeKey);
  t.dir = dir;
  t.line = line;
  t.terminal = terminal;
  t.route = buildRoute(line, dir);
  const entrySide = dir > 0 ? 'N:' : 'S:';
  const exitSide = dir > 0 ? 'S:' : 'N:';
  t.entryBlock = entrySide + line;
  t.exitBlock = (terminal ? entrySide : exitSide) + line;
  t.platBlock = 'P:' + line;
  t.sStop = t.route.sStop + t.len / 2;
  t.sExitClear = t.route.sAtZ(dir > 0 ? 190 : -190);
  t.state = 'wait';
  t.timer = phase;
  t.speed = 0;
  t.sHead = 0;
  t.joint = 0;
  t.group.visible = false;
  t.brakeDist = (t.type.maxSpeed ** 2) / 2.6;
  scene.add(t.group);
  trains.push(t);
  return t;
}

let parkedTrain = null;

function setDoors(t, open) {
  if (t.type.e5Atlas) return;          // E5 keeps its photo sides
  if (t.atlas) {
    t.sideMatA.map = open ? yamanoteMats.side1Open : yamanoteMats.side1;
    t.sideMatB.map = open ? yamanoteMats.side2Open : yamanoteMats.side2;
  } else {
    t.sideMatA.map = open ? t.type.sideOpen : t.type.sideClosed;
  }
}

const _p = { x: 0, z: 0, yaw: 0 };
function placeCars(t) {
  for (let i = 0; i < t.cars.length; i++) {
    const s = t.sHead - CAR_LEN / 2 - i * (CAR_LEN + CAR_GAP);
    t.route.posAt(s, _p);
    t.cars[i].position.set(_p.x, 0, _p.z);
    t.cars[i].rotation.y = _p.yaw;
  }
}

function despawn(t) {
  release(t.exitBlock, t);
  release(t.platBlock, t);
  t.state = 'wait';
  t.timer = 5 + Math.random() * 9;
  t.group.visible = false;
}

function updateTrain(t, dt) {
  switch (t.state) {
    case 'wait':
      t.timer -= dt;
      if (t.timer <= 0 && blockFree(t.entryBlock) && blockFree(t.platBlock)) {
        occupy(t.entryBlock, t);
        occupy(t.platBlock, t);
        t.state = 'enter';
        t.sHead = t.len + 2;
        t.speed = t.type.maxSpeed;
        t.group.visible = true;
        setTravel(t, true);
        placeCars(t);
      }
      break;
    case 'enter': {
      const dist = t.sStop - t.sHead;
      if (dist <= 0.08) {
        t.sHead = t.sStop; t.speed = 0;
        t.state = 'dwell'; t.timer = t.type.dwell;
        setDoors(t, true);
        sound.arrive();
      } else {
        if (dist < t.brakeDist)
          t.speed = Math.max(1.2, t.type.maxSpeed * Math.sqrt(dist / t.brakeDist));
        t.sHead += t.speed * dt;
      }
      if (blocks[t.entryBlock] === t && t.sHead - t.len > t.route.sEnterClear)
        release(t.entryBlock, t);
      placeCars(t);
      break;
    }
    case 'dwell':
      t.timer -= dt;
      if (t.timer <= 0 && blockFree(t.exitBlock)) {
        occupy(t.exitBlock, t);
        t.state = 'closing'; t.timer = 1.6;
        sound.doors();
      }
      break;
    case 'closing':
      t.timer -= dt;
      if (t.timer <= 0.9) setDoors(t, false);
      if (t.timer <= 0) {
        if (t.terminal) {
          t.state = 'departRev';
          setTravel(t, false);     // now running cab-first the other way
        } else {
          t.state = 'depart';
        }
        sound.jingle();
      }
      break;
    case 'depart':
      t.speed = Math.min(t.type.maxSpeed, t.speed + 2.2 * dt);
      t.sHead += t.speed * dt;
      if (blocks[t.platBlock] === t && t.sHead - t.len > t.sExitClear)
        release(t.platBlock, t);
      if (t.sHead >= t.route.S - 1) despawn(t);
      else placeCars(t);
      break;
    case 'departRev':   // terminal turnback: run back out the entry side
      t.speed = Math.min(t.type.maxSpeed, t.speed + 2.2 * dt);
      t.sHead -= t.speed * dt;
      if (t.sHead <= t.len + 2) despawn(t);
      else placeCars(t);
      break;
  }
  // rail joints every 25m → 가땅고똥
  if (t.group.visible && t.speed > 4) {
    const j = Math.floor(t.sHead / 25);
    if (j !== t.joint) {
      t.joint = j;
      sound.joint(t.speed, camera.position.distanceTo(t.cars[0].position), t.cars.length);
    }
  }
}

function updateSignals() {
  for (const sig of signals) {
    const occupied = !blockFree(sig.side + ':' + sig.line) || !blockFree('P:' + sig.line);
    sig.redMat.emissiveIntensity = occupied ? 1.6 : 0.05;
    sig.greenMat.emissiveIntensity = occupied ? 0.05 : 1.4;
  }
}

/* ================================================================
   Sound
================================================================ */
const sound = (() => {
  let ctx = null, on = false;
  const ensure = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  function tone(freq, delay, dur, type = 'triangle', vol = 0.12) {
    if (!on) return;
    ensure();
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.setValueAtTime(0, t0);
    gn.gain.linearRampToValueAtTime(vol, t0 + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(gn).connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  // rail-joint clatter: one metallic noise burst = one axle hitting a joint
  let noiseBuf = null;
  function clack(delay, vol) {
    ensure();
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, (ctx.sampleRate * 0.07) | 0, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++)
        d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.28));
    }
    const t0 = ctx.currentTime + delay;
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    s.playbackRate.value = 0.9 + Math.random() * 0.25;
    const f = ctx.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 750 + Math.random() * 450;
    f.Q.value = 1.1;
    const g = ctx.createGain();
    g.gain.value = vol;
    s.connect(f).connect(g).connect(ctx.destination);
    s.start(t0);
  }
  return {
    toggle() { on = !on; if (on) ensure(); return on; },
    // 가땅고똥: each car = two bogies × two axles; the rhythm stretches
    // with speed and fades with camera distance
    joint(speed, dist, cars) {
      if (!on || speed < 3) return;
      const vol = 0.2 / (1 + (dist / 48) ** 2);
      if (vol < 0.012) return;
      const axle = 2.1 / speed, bogie = 6.9 / speed, carT = 20 / speed;
      const n = Math.min(cars, 6);
      for (let i = 0; i < n; i++) {
        const b = i * carT;
        clack(b, vol);                          // 가
        clack(b + axle, vol * 0.85);            // 땅
        clack(b + bogie, vol * 0.9);            // 고
        clack(b + bogie + axle, vol * 0.78);    // 똥
      }
    },
    jingle() { [659, 784, 880, 784, 988, 880].forEach((f, i) => tone(f, i * 0.16, 0.15)); },
    arrive() { tone(740, 0, 0.25); tone(587, 0.28, 0.35); },
    doors() { tone(830, 0, 0.1, 'square', 0.07); tone(830, 0.18, 0.1, 'square', 0.07); },
    horn(high) {
      tone(high ? 520 : 310, 0, 0.55, 'sawtooth', 0.09);
      tone(high ? 620 : 370, 0, 0.55, 'sawtooth', 0.09);
    },
  };
})();

/* ================================================================
   Day / Night
================================================================ */
let isNight = false, nightBlend = 0;
const dayTop = new THREE.Color(0x3d7ad6), dayBot = new THREE.Color(0xcfe4f7);
const nightTop = new THREE.Color(0x050a18), nightBot = new THREE.Color(0x141d36);
const dayFog = new THREE.Color(0xcfe4f7), nightFog = new THREE.Color(0x0a0f1d);

function updateDayNight(dt) {
  const target = isNight ? 1 : 0;
  nightBlend += (target - nightBlend) * Math.min(1, dt * 1.6);
  const b = nightBlend;
  skyUniforms.topColor.value.copy(dayTop).lerp(nightTop, b);
  skyUniforms.bottomColor.value.copy(dayBot).lerp(nightBot, b);
  scene.fog.color.copy(dayFog).lerp(nightFog, b);
  sun.intensity = 2.0 * (1 - b) + 0.08 * b;
  hemiLight.intensity = 0.9 * (1 - b) + 0.22 * b;
  starMat.opacity = b * 0.9;
  moon.material.opacity = b;
  renderer.toneMappingExposure = 1.0 - b * 0.2;
  roofLightMat.emissiveIntensity = b * 1.8;
  station.userData.glowMat.emissiveIntensity = b * 1.5;
  for (const m of cityMats) m.emissiveIntensity = b * 1.0;
}

/* ================================================================
   Quality presets
================================================================ */
const qualities = {
  low:  { px: 0.7, shadows: false, shadowSize: 512,  fogFar: 450, detail: false },
  med:  { px: 1.0, shadows: true,  shadowSize: 1024, fogFar: 650, detail: true },
  high: { px: Math.min(devicePixelRatio, 2), shadows: true, shadowSize: 2048, fogFar: 800, detail: true },
};
function setTrainDetail(visible) {
  trainDetailVisible = visible;
  const all = parkedTrain ? [...trains, parkedTrain] : trains;
  for (const t of all)
    t.group.traverse(o => { if (o.userData.detail) o.visible = visible; });
}
function applyQuality(q) {
  const Q = qualities[q];
  renderer.setPixelRatio(Q.px);
  renderer.setSize(window.innerWidth, window.innerHeight);
  sun.castShadow = Q.shadows;
  renderer.shadowMap.enabled = Q.shadows;
  sun.shadow.mapSize.set(Q.shadowSize, Q.shadowSize);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  scene.traverse(o => {
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(mm => mm.needsUpdate = true);
    }
  });
  scene.fog.far = Q.fogFar;
  detailGroup.visible = Q.detail;
  cityFar.visible = Q.detail;
  setTrainDetail(Q.detail);
  document.querySelectorAll('#quality button').forEach(b => b.classList.toggle('active', b.dataset.q === q));
  toast({ low: '저사양 모드 (그림자·디테일 끔)', med: '보통 화질', high: '고화질 모드' }[q]);
}
const likelyLowEnd = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || navigator.hardwareConcurrency <= 4;

/* ================================================================
   Camera views & train following
================================================================ */
let camAnim = null;
let followTrain = null;

function flyTo(pos, target, dur = 1.4) {
  followTrain = null;
  controls.enabled = true;
  camAnim = {
    p0: camera.position.clone(), t0: controls.target.clone(),
    p1: new THREE.Vector3(...pos), t1: new THREE.Vector3(...target),
    k: 0, dur,
  };
  setActiveBtn();
}
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

const views = {
  sat:  { pos: [6, 330, 40], target: [6, 0, 0], label: '위성 뷰 🛰️' },
  plat: { pos: [-14, 3.2, 75], target: [-15.5, 2.6, -40], label: '승강장 뷰 🚉' },
  wide: { pos: [-105, 55, 165], target: [0, 6, -10], label: '전경 뷰 🏙️' },
};

let followIdx = -1;
const _fp = { x: 0, z: 0, yaw: 0 };
const followAnchor = new THREE.Vector3();

function snapToTrain(t) {
  t.route.posAt(t.sHead - 4, _fp);
  followAnchor.set(_fp.x, 2.5, _fp.z);
  const rev = t.state === 'departRev' ? -1 : 1;
  const fx = Math.sin(_fp.yaw) * rev, fz = Math.cos(_fp.yaw) * rev;
  camera.position.set(_fp.x - fx * 18 + fz * 14, 7.5, _fp.z - fz * 18 - fx * 14);
  controls.target.copy(followAnchor);
}

function followNext() {
  const candidates = trains.filter(t => t.group.visible);
  if (!candidates.length) { toast('지금은 들어오는 기차가 없어요. 잠시만요!'); return; }
  followIdx++;
  if (followIdx >= candidates.length) {      // cycled past the last train
    followIdx = -1;
    followTrain = null;
    toast('따라가기 해제 🆓');
    setActiveBtn();
    return;
  }
  followTrain = candidates[followIdx];
  camAnim = null;
  snapToTrain(followTrain);
  toast(`${followTrain.type.name} 따라가는 중 🚆 드래그·줌 자유!`);
  setActiveBtn();
}

// the camera rides along with the train: each frame we translate the
// camera and orbit target by the train's movement, so dragging/zooming
// (and the view preset buttons) never break the follow
function updateFollow() {
  if (!followTrain) return;
  if (!followTrain.group.visible) {
    const next = trains.find(t => t.group.visible);
    if (next) { followTrain = next; snapToTrain(next); toast(`${next.type.name} 따라가는 중 🚆`); }
    else { followTrain = null; followIdx = -1; setActiveBtn(); return; }
  }
  const t = followTrain;
  t.route.posAt(t.sHead - 4, _fp);
  const dx = _fp.x - followAnchor.x, dz = _fp.z - followAnchor.z;
  camera.position.x += dx; camera.position.z += dz;
  controls.target.x += dx; controls.target.z += dz;
  followAnchor.set(_fp.x, 2.5, _fp.z);
}

/* ================================================================
   UI
================================================================ */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

const btns = {
  follow: document.getElementById('btn-follow'),
  sat: document.getElementById('btn-sat'),
  plat: document.getElementById('btn-plat'),
  wide: document.getElementById('btn-wide'),
  night: document.getElementById('btn-night'),
  sound: document.getElementById('btn-sound'),
};
function setActiveBtn() {
  btns.follow.classList.toggle('active', !!followTrain);
}
btns.follow.addEventListener('click', followNext);
// view presets keep following: while a train is followed they just
// reposition the camera relative to it
function viewBtn(view, followOff) {
  return () => {
    if (followTrain) {
      camera.position.set(
        followAnchor.x + followOff[0], followOff[1], followAnchor.z + followOff[2]);
      controls.target.copy(followAnchor);
      toast(view.label + ' — 따라가기 유지 중 🚆');
    } else {
      flyTo(view.pos, view.target);
      toast(view.label);
    }
  };
}
btns.sat.addEventListener('click', viewBtn(views.sat, [0.1, 240, 0.1]));
btns.plat.addEventListener('click', viewBtn(views.plat, [10, 4.5, 14]));
btns.wide.addEventListener('click', viewBtn(views.wide, [60, 42, 75]));
btns.night.addEventListener('click', () => {
  isNight = !isNight;
  btns.night.firstChild.textContent = isNight ? '☀️' : '🌙';
  toast(isNight ? '밤이 되었어요 🌙' : '아침이 밝았어요 ☀️');
});
btns.sound.addEventListener('click', () => {
  const on = sound.toggle();
  btns.sound.firstChild.textContent = on ? '🔊' : '🔇';
  toast(on ? '소리 켜짐 — 기차를 터치해보세요!' : '소리 꺼짐');
  if (on) sound.jingle();
});
document.querySelectorAll('#quality button').forEach(b =>
  b.addEventListener('click', () => { currentQuality = b.dataset.q; applyQuality(b.dataset.q); }));

document.addEventListener('keydown', e => {
  if (e.code === 'KeyT') btns.night.click();
  if (e.code === 'KeyF') followNext();
  if (e.code === 'Digit1') btns.wide.click();
  if (e.code === 'Digit2') btns.sat.click();
  if (e.code === 'Digit3') btns.plat.click();
});

/* ---------- tap a train → horn ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null, dragged = false;

renderer.domElement.addEventListener('pointerdown', e => {
  downPos = [e.clientX, e.clientY];
  dragged = false;
});
renderer.domElement.addEventListener('pointermove', e => {
  if (downPos && Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 8)
    dragged = true;   // dragging orbits the camera but keeps the follow
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos || dragged) { downPos = null; return; }
  downPos = null;
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const all = parkedTrain ? [...trains, parkedTrain] : trains;
  for (const t of all) {
    if (!t.group.visible) continue;
    if (raycaster.intersectObject(t.group, true).length) {
      sound.horn(!!t.type.shink);
      toast(`${t.type.name} 빵빵! 🚆💨`);
      return;
    }
  }
});

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.classList.add('hidden');
  flyTo(views.wide.pos, views.wide.target, 2.2);
}, { once: true });

/* ================================================================
   Boot
================================================================ */
function startTrains() {
  // N700 stabled on the Shinkansen storage track
  parkedTrain = buildTrain('tokaido');
  for (let i = 0; i < parkedTrain.cars.length; i++) {
    const z = -82 + i * (CAR_LEN + CAR_GAP);
    parkedTrain.cars[i].position.set(LINES_X.TKP + bendAt(z), 0, z);
    parkedTrain.cars[i].rotation.y = Math.atan2(bendAt(z + 1) - bendAt(z), 1);
  }
  scene.add(parkedTrain.group);
}

let currentQuality = likelyLowEnd ? 'med' : 'high';

new THREE.TextureLoader().load(atlasData, (atlas) => {
  atlas.colorSpace = THREE.SRGBColorSpace;
  atlas.anisotropy = 8;
  const R = ATLAS_REGIONS;
  yamanoteMats.side1 = atlasRegionTex(atlas, R.side1);
  yamanoteMats.side2 = atlasRegionTex(atlas, R.side2);
  yamanoteMats.face = atlasRegionTex(atlas, R.face);
  yamanoteMats.faceBack = atlasRegionTex(atlas, R.face, true);
  yamanoteMats.under = atlasRegionTex(atlas, R.under);
  yamanoteMats.bogie = atlasRegionTex(atlas, R.bogie);
  yamanoteMats.ac = atlasRegionTex(atlas, R.ac);
  yamanoteMats.roof = makeRoofTex(atlas.image, R.roof);
  yamanoteMats.side1Open = makeOpenSideTex(atlas.image, R.side1);
  yamanoteMats.side2Open = makeOpenSideTex(atlas.image, R.side2);

  // second sheet: E5 Hayabusa
  new THREE.TextureLoader().load(e5Data, (e5) => {
    e5.colorSpace = THREE.SRGBColorSpace;
    e5.anisotropy = 8;
    const R5 = E5_REGIONS;
    e5Mats.side1 = atlasRegionTex(e5, R5.side1);
    e5Mats.side2 = atlasRegionTex(e5, R5.side2);
    e5Mats.under = atlasRegionTex(e5, R5.under);
    e5Mats.bogie = atlasRegionTex(e5, R5.bogie);
    e5Mats.roof = makeRoofTex(e5.image, R5.roof);

    for (const t of trains) {
      scene.remove(t.group);
      const fresh = buildTrain(t.typeKey);
      t.group = fresh.group; t.cars = fresh.cars;
      t.sideMatA = fresh.sideMatA; t.sideMatB = fresh.sideMatB;
      t.lampsPlus = fresh.lampsPlus; t.lampsMinus = fresh.lampsMinus;
      t.atlas = fresh.atlas;
      t.group.visible = t.state !== 'wait';
      scene.add(t.group);
      if (t.group.visible) {
        setTravel(t, t.state !== 'departRev');
        placeCars(t);
      }
    }
    startTrains();
    setTrainDetail(qualities[currentQuality].detail);
  });
});

applyQuality(currentQuality);

const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const t of trains) updateTrain(t, dt);
  updateSignals();
  updateDayNight(dt);
  updateFades(dt);
  if (camAnim) {
    camAnim.k += dt / camAnim.dur;
    const e = ease(Math.min(camAnim.k, 1));
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.k >= 1) camAnim = null;
  }
  updateFollow(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
